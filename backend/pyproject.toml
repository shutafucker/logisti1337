[project]
name = "logistiai-backend"
version = "0.1.0"
description = "LogistiAI routing domain and API application"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.135.0",
  "pydantic>=2.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
